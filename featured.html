<style>
/* 🟢 फक्त हे दोन उप-भाग लपवणे — संपूर्ण sidebar नाही (Archives जागी ticker दाखवायचाय) */
#block-2 { display: none !important; }

/* 🟢 फक्त हेच specific घटक — मुख्य फोटो/इतर भागाला धक्का लागणार नाही */
.secondary-sidebar { display: block !important; align-self: flex-start !important; }
aside#secondary { height: auto !important; }

/* 🟢 Featured-पट्टीची बाहेरची चौकट — जुन्या widget-बॉक्स सारखी दिसण्यासाठी + पूर्ण बॉक्सला 3D hover */
#block-5 {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    overflow: hidden !important;
    padding: 15px !important;
    background: #fff !important;
    border: 1px solid #eee !important;
    border-bottom: 4px solid #F40257 !important;
    border-radius: 8px !important;
    transition: box-shadow 0.25s ease, transform 0.25s ease;
    transform: perspective(1000px) translateZ(0);
}
#block-5:hover {
    box-shadow: 0 10px 22px rgba(244,2,87,0.20);
    transform: perspective(1000px) translateZ(15px) scale(1.01);
}
/* 🟢 आतला मजकूर बाहेरच्या गोल कोपऱ्यांबाहेर कधीच जाणार नाही — एकजीव कोपरे */
#block-5 * { border-radius: inherit; }

/* 🟢 3 (लॅपटॉप) / 2 (मोबाईल) उभे स्तंभ असलेला मुख्य कंटेनर — ठाम उंची, कधीही अनंत ताणणार नाही */
.vs-ft-cols { display:flex; gap:8px; height:320px; overflow:hidden; }
.vs-ft-col { flex:1; min-width:0; overflow:hidden; position:relative; border-radius:8px; }
.vs-ft-col-track { display:flex; flex-direction:column; gap:8px; }

/* 🟢 प्रत्येक व्यवसायाचं छोटं कार्ड — कॅटेगरी वर, नाव खाली, निश्चित उंची (माहिती कमी-जास्त असली तरी आकार बदलणार नाही) */
.vs-ft-item {
    text-align:center;
    display:block;
    text-decoration:none;
    height:112px;
    box-sizing:border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.vs-ft-item img {
    width:100%; height:70px; object-fit:cover; border-radius:6px;
    border-bottom:3px solid #F40257; display:block;
}
.vs-ft-cat, .vs-ft-name {
    font-size:11px; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    height:16px; line-height:16px;
}
.vs-ft-cat { color:#F40257; font-weight:600; }
.vs-ft-name { color:#333; }

/* 🟢 प्रत्येक कार्डाला स्वतंत्र 3D hover — "समोरच्या दिशेने उचलल्यासारखा" परिणाम */
.vs-ft-item:hover {
    transform: perspective(1000px) translateZ(15px) scale(1.03);
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    z-index: 2;
    position: relative;
}
.vs-ft-item:hover img { filter: brightness(1.06); }

/* 🟢 खालून-वर सतत सरकणारी हालचाल — प्रत्येक स्तंभ सावकाश (120s), वाचता येईल इतपत */
@keyframes vsFtUp { from{ transform:translateY(0);} to{ transform:translateY(-50%);} }
.vs-ft-col .vs-ft-col-track { animation: vsFtUp 120s linear infinite; }

/* 🟢 माऊस त्या स्तंभावर नेल्यावर फक्त तीच रांग थांबेल, बाकी दोन सुरूच राहतील */
.vs-ft-col:hover .vs-ft-col-track { animation-play-state: paused !important; }

/* 🟢 तिसरा स्तंभ फक्त लॅपटॉप/टॅबवर (768px+) दिसेल, मोबाईलवर फक्त 2 स्तंभ */
.vs-ft-col:nth-child(3) { display:none; }
@media (min-width:768px){ .vs-ft-col:nth-child(3) { display:block; } }

/* 🟢 व्यावसायिकाचं नावं व पत्ता फॉन्ट कलर */
.vs-f-info h3 { color: #F40257 !important; }
.vs-f-address { color: #27CFF5 !important; }

</style>

<script>
window.addEventListener('load', function(){
    var FT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSyY6wenEtP6gK8mMara31fx_dYK-fAtdyIourHBZY91JF75JeR_B08t7Gk2mOsrly/exec";

    function ftPhoto(item){
        var rawUrl = item.photo_url || "";
        var id = "";
        if (rawUrl.includes('id=')) id = rawUrl.split('id=')[1].split('&')[0];
        else if (rawUrl.includes('/d/')) id = rawUrl.split('/d/')[1].split('/')[0];
        else id = rawUrl;
        return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w200';
    }

    function ftItemHtml(item){
        return '<a href="https://vastavpost.live/business-directory/?reg_id=' + encodeURIComponent(item.reg_id) + '" target="_blank" class="vs-ft-item">' +
            '<img src="' + ftPhoto(item) + '" loading="lazy" alt="Shop">' +
            '<div class="vs-ft-cat">🏷 ' + item.category + '</div>' +
            '<div class="vs-ft-name">' + item.owner_name + '</div>' +
            '</a>';
    }

    fetch(FT_APPS_SCRIPT_URL + "?action=getApprovedBusinesses")
        .then(function(res){ return res.json(); })
        .then(function(data){
            var featured = data.filter(function(i){ return i.featured == "Yes"; });
            featured.sort(function(a,b){
                var pa = Number(a.priority) || 999999;
                var pb = Number(b.priority) || 999999;
                return pa - pb;
            });
            if (featured.length === 0) return;

            var cols = [[],[],[]];
            featured.forEach(function(item, idx){ cols[idx % 3].push(item); });

            var colsHtml = cols.map(function(colItems){
                if (colItems.length === 0) return '<div class="vs-ft-col"></div>';
                var itemsHtml = colItems.map(ftItemHtml).join('');
                return '<div class="vs-ft-col"><div class="vs-ft-col-track">' + itemsHtml + itemsHtml + '</div></div>';
            }).join('');

            var block = document.getElementById('block-5');
            if (!block) return;
            block.innerHTML = '<h3 style="margin-bottom:10px;color:#333;">⭐ Featured व्यवसाय</h3><div class="vs-ft-cols">' + colsHtml + '</div>';
        })
        .catch(function(){});
});
</script>
